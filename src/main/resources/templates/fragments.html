<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Taskmaster</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Shared Navbar -->
    <div th:fragment="navbar">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">Taskmaster</a>
                <a class="nav-link" href="/info">(i)</a>
                <a class="nav-link" href="/createTicket">+ Ticket</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" href="/login">Login</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <a class="nav-link" href="/userPage" sec:authentication="name">username</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <!-- We use a form to send a POST request for secure logout -->
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button class="nav-link btn btn-link" type="submit">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- Shared Footer -->
    <div th:fragment="footer" class="mt-5">
        <footer class="bg-light text-center py-4 border-top">
            <p class="mb-0 text-muted">Taskmaster &copy; 2026. All rights reserved.</p>
            <!-- Bootstrap JS -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        </footer>
    </div>
</body>
</html>
