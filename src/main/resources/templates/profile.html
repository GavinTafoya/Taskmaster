<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments.html :: head('User Profile - Taskmaster')">
<body>
    <div th:replace="fragments.html :: navbar"></div>

    <div class="container mt-5">
        <h1>User Profile</h1>
         <div th:if="${param.success}" class="alert alert-success">
            Profile updated successfully.
        </div>

        <form th:action="@{/profile}" th:object="${userProfile}" method="post" class="mt-4">
            
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" th:field="*{firstName}">
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" th:field="*{lastName}">
            </div>

            <div class="mb-3">
                <label for="emailAddress" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="emailAddress" th:field="*{emailAddress}">
                <div class="text-danger" th:if="${#fields.hasErrors('emailAddress')}" th:errors="*{emailAddress}"></div>
            </div>

            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a href="/teams/manage" class="btn btn-secondary ms-2">Manage Teams</a>
        </form>
    </div>

    <div th:replace="fragments.html :: footer"></div>
</body>
</html>
