spring.application.name=Taskmaster

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmaster
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Automatically creates/updates your database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Show SQL queries in the logs (helpful for debugging)
spring.jpa.show-sql=true

# Thymeleaf Configuration (disables cache so changes show up immediately locally)
spring.thymeleaf.cache=false
